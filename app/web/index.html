<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Pramaan - offline UPI scam shield">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Pramaan">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #0B1020;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    flutter-view, flt-scene-host, canvas {
      -webkit-user-select: none;
      user-select: none;
      contain: strict;
    }
    * {
      -webkit-tap-highlight-color: transparent;
    }
    *::-webkit-scrollbar {
      display: none;
    }
  </style>
  <title>Pramaan — Proof before you pay.</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Clear any previously-installed service workers / offline caches
    // before Flutter boots. Older deployments cached main.dart.js against
    // a stale asset manifest which rendered a blank canvas on reload.
    (function () {
      if ('serviceWorker' in navigator) {
        try {
          navigator.serviceWorker.getRegistrations().then(function (rs) {
            for (var i = 0; i < rs.length; i++) rs[i].unregister();
          });
        } catch (e) { }
      }
      if (window.caches) {
        try {
          window.caches.keys().then(function (names) {
            for (var i = 0; i < names.length; i++) window.caches.delete(names[i]);
          });
        } catch (e) { }
      }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
