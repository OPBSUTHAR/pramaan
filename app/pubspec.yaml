name: pramaan
description: "Pramaan - offline UPI scam shield for India. Proof before you pay."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # The offline detection engine. Pure Dart, no network, no models.
